prepare_synthetic_data:
  seed: 0xC00FFEE
  data_dir: data/synthetic_dataset
  train_size: 0.8
  blur_size: 21
  background_size: [960, 1280]
  image_size: [120, 160]
  primitives:
    draw_lines: 20_000
    draw_polygon: 20_000
    draw_ellipses: 20_000
    draw_star: 20_000
    draw_checkerboard: 20_000
    draw_stripes: 20_000
    draw_cube: 20_000
    gaussian_noise: 20_000

homography:_config: &homography_config
  allow_artifacts: true
  max_angle: 1.57
  patch_ratio: 0.8
  perspective: true
  perspective_amplitude_x: 0.2
  perspective_amplitude_y: 0.2
  rotation: true
  scaling: true
  scaling_amplitude: 0.2
  translation: true
  translation_overflow: 0.05
  n_scales: 5
  n_angles: 25
  valid_border_margin: 2

train_magicpoint:
  seed: 0xC00FFEE
  num_epochs: 300 # 500
  learning_rate: 0.001
  cell_size: 8
  detection_threshold: 0.015
  nms_dist: 4
  limit_val_batches: 100
  log_dir: results/train_magic_point
  data_dir: data/synthetic_dataset
  train_size: 0.8
  train_batch_size: 64 # 128
  val_batch_size: 64
  num_workers: 12 # 16
  augmentation:
    homographic: *homography_config
    photometric:
      random_brightness:
        max_abs_change: 75
      random_contrast:
        strength_range: [0.3, 1.8]
      additive_gaussian_noise:
        stddev_range: [0, 15]
      additive_speckle_noise:
        prob_range: [0, 0.0035]
      motion_blur:
        max_kernel_size: 7
      additive_shade:
        kernel_size_range: [50, 100]
        transparency_range: [-0.5, 0.8]
        nb_ellipses: 20

eval_magicpoint:
  data_dir: data/synthetic_dataset/test
  checkpoint: models/magic_point.ckpt # models/superpoint_v1.pth
  batch_size: 256
  output_dir: tmp
  detection_threshold: 0.015
  nms_dist: 4

homographic_adaptation:
  output_dir: data/homo_adapt
  checkpoint: models/magic_point.ckpt # models/superpoint_v1.pth
  data_dir: data/satellite
  max_workers: 12
  num: 100
  top_k: 600
  detection_threshold: 0.015
  nms_dist: 4
  homographic: *homography_config

prepare_satellite_data:
  seed: 0xC00FFEE
  data_dir: data/satellite/17
  out_dir: data/satellite_data
  max_workers: 12
  tiles_need: 625
  zoom: 17 # zoom 17 соответствует примерно 1 px / m
  num_tiles: 10 # число тайлов по ширине и высоте изображения
  tile_size: 256 # размер тайла в пикселях
  map_box:
    - 37.56000 # min_lon
    - 55.71500 # min_lat
    - 38.00000 # max_lon
    - 56.35000 # max_lat
  osm: data/map.osm.pbf
  sources: ## TMS сервисы
    google: "http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"
    bing: "http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2"
    arcgis: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    yandex: "https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}"
