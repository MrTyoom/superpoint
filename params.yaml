seed: 0xC00FFEE # seed для воспроизводимости

synthetic_dataset: data/synthetic_dataset # директория для синтетических изображений

prepare_synthetic_data:
  seed: ${seed}
  data_dir: ${synthetic_dataset}
  blur_size: 21
  image_size: [120, 160]
  primitives: 
    draw_lines: 20_000
    draw_polygon: 20_000
    draw_ellipses: 20_000
    draw_star: 20_000
    draw_checkerboard: 20_000
    draw_stripes: 20_000
    draw_cube: 20_000
    gaussian_noise: 20_000

train_magicpoint:
  seed: ${seed}
  data_dir: ${synthetic_dataset}
  train_size: 0.8
  batch_size: 64
  num_workers: 0
