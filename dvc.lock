schema: '2.0'
stages:
  prepare_synthetic_data:
    cmd: python scripts/prepare_synthetic_data.py
    deps:
    - path: scripts/prepare_synthetic_data.py
      hash: md5
      md5: 9bee99801bafd61cb5d7602387c970ce
      size: 33647
    params:
      params.yaml:
        prepare_synthetic_data:
          seed: 12648430
          data_dir: data/synthetic_dataset
          train_size: 0.8
          blur_size: 21
          background_size:
          - 960
          - 1280
          image_size:
          - 120
          - 160
          primitives:
            draw_lines: 20000
            draw_polygon: 20000
            draw_ellipses: 20000
            draw_star: 20000
            draw_checkerboard: 20000
            draw_stripes: 20000
            draw_cube: 20000
            gaussian_noise: 20000
    outs:
    - path: data/synthetic_dataset
      hash: md5
      md5: 62e512f92e270a23c67ed88c6d583cfd.dir
      size: 1063118825
      nfiles: 320000
  train_magicpoint:
    cmd: python src/train_magicpoint.py
    params:
      params.yaml:
        train_magicpoint:
          seed: 12648430
          num_epochs: 300
          learning_rate: 0.001
          cell_size: 8
          detection_threshold: 0.015
          nms_dist: 4
          limit_val_batches: 100
          log_dir: results/train_magic_point
          data_dir: data/synthetic_dataset
          train_size: 0.8
          train_batch_size: 64
          val_batch_size: 64
          num_workers: 12
          augmentation:
            homographic:
              allow_artifacts: true
              max_angle: 1.57
              patch_ratio: 0.8
              perspective: true
              perspective_amplitude_x: 0.2
              perspective_amplitude_y: 0.2
              rotation: true
              scaling: true
              scaling_amplitude: 0.2
              translation: true
              translation_overflow: 0.05
              n_scales: 5
              n_angles: 25
              valid_border_margin: 2
            photometric:
              random_brightness:
                max_abs_change: 75
              random_contrast:
                strength_range:
                - 0.3
                - 1.8
              additive_gaussian_noise:
                stddev_range:
                - 0
                - 15
              additive_speckle_noise:
                prob_range:
                - 0
                - 0.0035
              motion_blur:
                max_kernel_size: 7
              additive_shade:
                kernel_size_range:
                - 50
                - 100
                transparency_range:
                - -0.5
                - 0.8
                nb_ellipses: 20
  prepare_satellite_images:
    cmd: python scripts/prepare_satellite_images.py
    deps:
    - path: data/satellite
      hash: md5
      md5: d99a92a35b51b4614c2c1c3ad9e1f067.dir
      size: 497748125
      nfiles: 40
    - path: scripts/prepare_satellite_images.py
      hash: md5
      md5: 92801ce0b18f14c5035500eaf0d4d0a8
      size: 4985
    params:
      params.yaml:
        prepare_satellite_images:
          seed: 12648430
          satellite_dir: data/satellite
          crop_size: 480
          images_dir: data/satellite_images
          train_size: 0.9
    outs:
    - path: data/satellite_images
      hash: md5
      md5: 77c21fd68fd4dce85dc7bb1e9d84181a.dir
      size: 443487839
      nfiles: 9000
  download_satellite_data:
    cmd: python scripts/download_satellite_data.py
    params:
      params.yaml:
        download_satellite_data:
          data_dir: data/satellite
          max_workers: 12
          tiles_need: 10
          zoom: 17
          num_tiles: 30
          tile_size: 256
          map_box:
          - 37.56
          - 55.715
          - 38.0
          - 56.35
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis: 
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: d99a92a35b51b4614c2c1c3ad9e1f067.dir
      size: 497748125
      nfiles: 40
